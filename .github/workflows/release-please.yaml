on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
name: release-please
env:
  ACTION_NAME: release-please-action
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20
    - name: install
      run: npm ci
    - name: build
      run: npm run build
    - name: Create PR with dist
      uses: googleapis/code-suggester@c8a43cd63f56d475a4be2d9bc573bebd8fc0079d # v5.0.1
      with:
        command: pr
        upstream_repo: release-please-action
        upstream_owner: googleapis
        description: Build dist
        title: "chore: build dist"
        message: "chore: build dist"
        labels: automated pr
        branch: build-dist
        force: true
        git_dir: .
        fork: true
      env:
        ACCESS_TOKEN: ${{ secrets.YOSHI_CODE_BOT_TOKEN }}
  release-please-release:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@0b6b3fc0186a2f7118bfd88fab9ea481e1839504 # main
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          skip-github-pull-request: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tag major and minor versions
        env:
          MAJOR_TAG: v${{ steps.release.outputs.major }}
          MINOR_TAG: v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add gh-token "https://${{ secrets.GITHUB_TOKEN}}@github.com/googleapis/release-please-action.git"
          git tag -d "${MAJOR_TAG}" || true
          git tag -d "${MINOR_TAG}" || true
          git push origin ":${MAJOR_TAG}" || true
          git push origin ":${MINOR_TAG}" || true
          git tag -a "${MAJOR_TAG}" -m "Release ${MAJOR_TAG}"
          git tag -a "${MINOR_TAG}" -m "Release ${MINOR_TAG}"
          git push origin "${MAJOR_TAG}"
          git push origin "${MINOR_TAG}"
        if: ${{ steps.release.outputs.release_created }}
  release-please-pr:
    runs-on: ubuntu-latest
    needs:
      - build
      - release-please-release
    steps:
      - id: release-pr
        uses: googleapis/release-please-action@0b6b3fc0186a2f7118bfd88fab9ea481e1839504 # main
        with:
          token: ${{ secrets.YOSHI_CODE_BOT_TOKEN }}
          release-type: node
          fork: true
          skip-github-release: true
